name: Build Nabi Stacks

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Extract source
        run: unzip -o Nabi_Stacks_v1.0.0-dev-source.zip -d project
      - name: Build
        working-directory: project
        run: gradle build --stacktrace
      - name: Upload JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nabi-stacks-build
          path: project/build/libs/*.jar
          if-no-files-found: warn
